<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Harshit Bhardwaj — Full Stack Developer</title>
  <desc id="description">A light-blue glassmorphism banner presenting Harshit Bhardwaj as a Full Stack Developer building scalable products, real-time experiences and reliable backend systems.</desc>
  <defs>
    <linearGradient id="background" x1="30" y1="15" x2="1170" y2="445" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF9FF"/>
      <stop offset=".52" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="glass" x1="138" y1="65" x2="1062" y2="395" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".82"/>
      <stop offset=".5" stop-color="#F8FAFC" stop-opacity=".54"/>
      <stop offset="1" stop-color="#E0F2FE" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="headline" x1="390" y1="135" x2="950" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#075985"/>
      <stop offset=".5" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="neon" x1="138" y1="65" x2="1062" y2="395" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".35" stop-color="#38BDF8"/>
      <stop offset=".7" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="brand" cx="0" cy="0" r="1" gradientTransform="translate(275 216) rotate(51) scale(102)">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".42" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </radialGradient>
    <filter id="orbBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0369A1" flood-opacity=".15"/>
    </filter>
    <filter id="lineGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="138" y="65" width="924" height="330" rx="44"/>
    </clipPath>
  </defs>

  <rect width="1200" height="460" rx="32" fill="url(#background)"/>

  <circle cx="105" cy="82" r="130" fill="#38BDF8" fill-opacity=".28" filter="url(#orbBlur)">
    <animate attributeName="cx" values="105;170;105" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1090" cy="365" r="145" fill="#818CF8" fill-opacity=".24" filter="url(#orbBlur)">
    <animate attributeName="cy" values="365;300;365" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="45" r="76" fill="#22D3EE" fill-opacity=".2" filter="url(#orbBlur)">
    <animate attributeName="r" values="76;105;76" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".32">
    <path d="M0 92H1200M0 184H1200M0 276H1200M0 368H1200" stroke="#7DD3FC" stroke-opacity=".28"/>
    <path d="M100 0V460M200 0V460M300 0V460M400 0V460M500 0V460M600 0V460M700 0V460M800 0V460M900 0V460M1000 0V460M1100 0V460" stroke="#7DD3FC" stroke-opacity=".2"/>
    <circle cx="100" cy="92" r="3" fill="#0EA5E9"/>
    <circle cx="1000" cy="276" r="3" fill="#0EA5E9"/>
    <circle cx="700" cy="368" r="3" fill="#38BDF8"/>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="138" y="65" width="924" height="330" rx="44" fill="url(#glass)"/>
    <rect x="139" y="66" width="922" height="328" rx="43" stroke="#FFFFFF" stroke-opacity=".84" stroke-width="2"/>
  </g>

  <rect x="140.5" y="67.5" width="919" height="325" rx="40.5" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-dasharray="145 1850" filter="url(#lineGlow)">
    <animate attributeName="stroke-dashoffset" values="1995;0" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#panelClip)">
    <path d="M-180 450L235 10H355L-60 450H-180Z" fill="#FFFFFF" fill-opacity=".16">
      <animateTransform attributeName="transform" type="translate" values="-360 0;1440 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="190" y="132" width="160" height="160" rx="40" fill="#F8FAFC" fill-opacity=".74" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="202" y="144" width="136" height="136" rx="32" fill="#E0F2FE" fill-opacity=".64" stroke="#BAE6FD"/>
  <text x="270" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="url(#brand)">HB</text>
  <path d="M220 202L205 217L220 232M320 202L335 217L320 232" stroke="#0284C7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="390" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#0284C7">FULL STACK DEVELOPER</text>
  <text x="386" y="210" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" letter-spacing=".5" fill="url(#headline)">HARSHIT BHARDWAJ</text>
  <text x="390" y="255" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#334155">Building scalable products, real-time experiences</text>
  <text x="390" y="283" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#334155">and reliable backend systems.</text>

  <g transform="translate(390 315)">
    <rect width="405" height="38" rx="19" fill="#E0F2FE" fill-opacity=".78" stroke="#BAE6FD"/>
    <circle cx="22" cy="19" r="5" fill="#0EA5E9">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3" fill="#075985">MERN • MICROSERVICES • REAL-TIME SYSTEMS</text>
  </g>

  <g opacity=".78">
    <circle cx="1018" cy="105" r="5" fill="#38BDF8"><animate attributeName="cy" values="105;120;105" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="230" r="7" fill="#818CF8"><animate attributeName="cy" values="230;207;230" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="358" r="5" fill="#0EA5E9"><animate attributeName="cx" values="1010;988;1010" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>

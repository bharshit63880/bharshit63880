<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F9FF"/>
      <stop offset=".48" stop-color="#DFF5FF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="glass" x1="180" y1="55" x2="1020" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".78"/>
      <stop offset="1" stop-color="white" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="type" x1="360" y1="125" x2="865" y2="255" gradientUnits="userSpaceOnUse">
      <stop stop-color="#075985"/>
      <stop offset=".48" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="mark" x1="232" y1="135" x2="326" y2="268" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".48" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0369A1" flood-opacity=".16"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="120" y="55" width="960" height="310" rx="42"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#sky)"/>

  <circle cx="116" cy="62" r="112" fill="#38BDF8" fill-opacity=".38" filter="url(#blur)">
    <animate attributeName="cx" values="116;175;116" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1054" cy="338" r="135" fill="#A78BFA" fill-opacity=".3" filter="url(#blur)">
    <animate attributeName="cy" values="338;278;338" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="925" cy="62" r="58" fill="#22D3EE" fill-opacity=".25" filter="url(#blur)">
    <animate attributeName="r" values="58;88;58" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".42">
    <path d="M0 84H1200M0 168H1200M0 252H1200M0 336H1200" stroke="#7DD3FC" stroke-opacity=".2"/>
    <path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420M720 0V420M840 0V420M960 0V420M1080 0V420" stroke="#7DD3FC" stroke-opacity=".17"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="55" width="960" height="310" rx="42" fill="url(#glass)"/>
    <rect x="120.75" y="55.75" width="958.5" height="308.5" rx="41.25" stroke="white" stroke-opacity=".82" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#panelClip)">
    <path d="M40 420L390 0H520L170 420H40Z" fill="white" fill-opacity=".16">
      <animateTransform attributeName="transform" type="translate" values="-450 0;1150 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="184" y="119" width="156" height="156" rx="38" fill="#F8FDFF" fill-opacity=".76" stroke="white" stroke-width="2"/>
  <rect x="195" y="130" width="134" height="134" rx="30" fill="#E0F2FE" fill-opacity=".58"/>
  <text x="262" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" fill="url(#mark)">HB</text>
  <path d="M213 195L198 210L213 225M311 195L326 210L311 225" stroke="#0284C7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="311" cy="147" r="7" fill="#A78BFA">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <text x="382" y="168" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#0284C7">HELLO, I'M</text>
  <text x="378" y="232" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="url(#type)">HARSHIT BHARDWAJ</text>
  <text x="382" y="278" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" letter-spacing="3.5" fill="#475569">FULL STACK DEVELOPER</text>

  <g transform="translate(382 305)">
    <rect width="122" height="30" rx="15" fill="#E0F2FE" stroke="#BAE6FD"/>
    <circle cx="18" cy="15" r="5" fill="#22C55E">
      <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#0369A1">OPEN TO WORK</text>
  </g>

  <g opacity=".65">
    <circle cx="1045" cy="88" r="4" fill="#38BDF8">
      <animate attributeName="cy" values="88;102;88" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="170" r="6" fill="#A78BFA">
      <animate attributeName="cy" values="170;149;170" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="323" r="5" fill="#0EA5E9">
      <animate attributeName="cx" values="1050;1028;1050" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

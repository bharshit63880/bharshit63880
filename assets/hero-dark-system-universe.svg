  <circle cx="1260" cy="90" r="2" fill="#22D3EE"/><circle cx="1180" cy="210" r="1.5" fill="#fff"/>
  <circle cx="1020" cy="55" r="1.7" fill="#A78BFA"/><circle cx="330" cy="310" r="1.6" fill="#22D3EE"/>
</g>
<g transform="translate(110,80)">
  <rect x="0" y="0" width="430" height="255" rx="24" fill="#08111F" stroke="#334155"/>
  <rect x="28" y="28" width="374" height="176" rx="14" fill="#0F172A" stroke="#1E293B"/>

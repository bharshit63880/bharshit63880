<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/>
    <stop offset="0.45" stop-color="#0B1025"/>
    <stop offset="1" stop-color="#160B2F"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="45%" r="60%">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".42"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="soft"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22D3EE" flood-opacity=".35"/></filter>
</defs>
<rect width="1400" height="420" fill="url(#bg)"/>
<rect width="1400" height="420" fill="url(#glow)"/>
<g opacity=".35">

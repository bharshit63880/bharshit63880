  <text x="0" y="150" font-family="Arial, sans-serif" font-size="21" fill="#CBD5E1">React • Node.js • TypeScript • Real-Time Systems</text>
  <text x="0" y="185" font-family="Arial, sans-serif" font-size="21" fill="#CBD5E1">Kafka • Redis • Docker • Microservices</text>
  <g transform="translate(0,225)">
